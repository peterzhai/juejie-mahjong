<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雀界 · 广东麻将</title>
  <style>
    :root {
      --gold: #f0c75e;
      --gold-d: #b8860b;
      --panel: rgba(10, 40, 24, .92);
      --line: #2f6b45;
      --red: #d94f3d;
      --blue: #3d7dd9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      color: #eee;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #1d6b3c 0%, transparent 60%),
        radial-gradient(900px 500px at 85% 110%, #14532d 0%, transparent 55%),
        linear-gradient(160deg, #0d3b22 0%, #082a18 55%, #051c10 100%);
      min-height: 100vh;
    }
    #app { max-width: 1180px; margin: 0 auto; padding: 12px 16px 24px; }

    /* —— 顶栏 —— */
    header.top {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 4px 14px;
    }
    .logo {
      font-size: 24px; font-weight: 800; letter-spacing: 2px; color: var(--gold);
      text-shadow: 0 2px 0 #7a5a10, 0 4px 10px rgba(0,0,0,.5);
    }
    .logo small { font-size: 12px; color: #9fd0b2; font-weight: 400; letter-spacing: 1px; margin-left: 8px; }
    .top .spacer { flex: 1; }
    #conn-status { font-size: 13px; color: #9fd0b2; }

    /* —— 通用面板 —— */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
    }
    h2 { font-size: 15px; color: var(--gold); margin: 4px 0 8px; }

    input, select, button {
      font-size: 14px; padding: 7px 12px; border-radius: 8px;
      border: 1px solid #3a7a55; background: #123f28; color: #eee;
      font-family: inherit;
    }
    input:focus, select:focus { outline: 2px solid #57a773; border-color: #57a773; }
    button { cursor: pointer; background: linear-gradient(#2f7a4d, #25603a); border-color: #3f8f5c; transition: filter .12s, transform .05s; }
    button:hover { filter: brightness(1.15); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.primary { background: linear-gradient(#e6b93f, #b8860b); border-color: #e8c56a; color: #2a1e05; font-weight: 700; }
    button.danger { background: linear-gradient(#a03c34, #7c2b25); border-color: #c96a5a; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
    .hidden { display: none !important; }
    .badge { display: inline-block; background: #1d5c39; border: 1px solid #357a52; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; margin-right: 6px; color: #d8f0e2; }
    .scores { color: var(--gold); font-weight: 600; }
    .switch { cursor: pointer; font-size: 13px; color: #cfe8d8; }

    /* —— 大厅 —— */
    #lobby .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* —— 房间面板 —— */
    .player-chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: #143d27; border: 1px solid #2f6b45; border-radius: 999px;
      padding: 5px 14px 5px 6px; font-size: 14px; margin: 4px 6px 4px 0;
    }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
      border: 2px solid rgba(255,255,255,.35);
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
    }
    .player-chip.me { border-color: var(--gold); box-shadow: 0 0 8px rgba(232,197,106,.35); }
    .player-chip .st { font-size: 11px; color: #9fd0b2; }

    /* —— 牌桌 —— */
    .table {
      position: relative;
      border-radius: 26px;
      border: 10px solid transparent;
      background:
        radial-gradient(ellipse at 50% 42%, #2c8a52 0%, #1e6b3c 55%, #175430 100%);
      box-shadow:
        inset 0 0 60px rgba(0,0,0,.45),
        inset 0 2px 0 rgba(255,255,255,.08),
        0 10px 30px rgba(0,0,0,.5);
      padding: 14px 18px 18px;
      margin-bottom: 12px;
    }
    /* 木质桌沿 */
    .table::before {
      content: ""; position: absolute; inset: -10px; border-radius: 30px; z-index: -1;
      background:
        repeating-linear-gradient(93deg, #6b4423 0 14px, #7d5130 14px 28px, #5d3a1e 28px 42px);
      box-shadow: 0 8px 20px rgba(0,0,0,.55), inset 0 0 0 2px #3f2712;
    }
    .table-topbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }

    .seat-zone { display: flex; justify-content: center; }
    .seat-zone.bottom { margin-top: 10px; }
    .table-mid {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start;
    }
    .seat-side { display: flex; align-items: flex-start; }
    .seat-side.left { justify-content: flex-start; }
    .seat-side.right { justify-content: flex-end; }
    .table-center { min-width: 220px; text-align: center; padding-top: 8px; }
    .center-info { font-size: 13px; color: #cfe8d8; line-height: 1.9; }
    .center-info b { color: var(--gold); }

    /* —— 座位 —— */
    .seat {
      background: rgba(8, 30, 18, .78);
      border: 2px solid rgba(90, 160, 115, .5);
      border-radius: 14px;
      padding: 8px 12px;
      min-width: 240px; max-width: 460px;
      transition: box-shadow .2s, border-color .2s;
      position: relative;
    }
    .seat.current {
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(240,199,94,.45);
      animation: turnGlow 1.6s ease-in-out infinite;
    }
    @keyframes turnGlow {
      0%,100% { box-shadow: 0 0 8px rgba(240,199,94,.3); }
      50% { box-shadow: 0 0 20px rgba(240,199,94,.65); }
    }
    .seat .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .seat .head .avatar { width: 34px; height: 34px; font-size: 15px; }
    .seat .name { font-weight: 700; color: var(--gold); font-size: 15px; }
    .seat .sub { font-size: 11px; color: #9fd0b2; }
    .dealer-tag {
      display: inline-block; background: var(--gold-d); color: #fff; border-radius: 6px;
      font-size: 11px; font-weight: 700; padding: 1px 7px; margin-left: 6px; vertical-align: 2px;
    }
    .melds { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 4px 0; }
    .meld-tag { font-size: 11px; color: #9fd0b2; }
    .river {
      display: flex; flex-wrap: wrap; gap: 3px; max-width: 420px;
      background: rgba(0,0,0,.22); border-radius: 8px; padding: 5px 7px; min-height: 30px;
    }
    .seat.bottom-seat { max-width: none; width: 100%; }
    .seat.bottom-seat .river { max-width: 560px; }
    .seat.bottom-seat .hand-row { margin-top: 8px; display: flex; align-items: flex-end; gap: 4px; flex-wrap: wrap; }

    /* —— 牌 —— */
    .tile {
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #fffdf4 0%, #f6ecd2 55%, #e9d9b4 100%);
      border-radius: 8px; border: 1px solid #b89a5e;
      box-shadow: 0 2px 4px rgba(0,0,0,.45), inset 0 1px 0 #fff;
      color: #26303c; font-weight: 700;
      user-select: none; line-height: 1;
      min-width: 58px; height: 76px; padding: 0 6px; font-size: 52px;
      cursor: pointer; position: relative; transition: transform .08s, box-shadow .08s;
    }
    .tile:hover { transform: translateY(-3px); box-shadow: 0 5px 8px rgba(0,0,0,.5), inset 0 1px 0 #fff; }
    .tile.sel {
      transform: translateY(-14px);
      outline: 3px solid var(--red);
      box-shadow: 0 8px 12px rgba(0,0,0,.55);
      z-index: 2;
    }
    .tile.small { min-width: 40px; height: 50px; font-size: 38px; border-radius: 6px; padding: 0 2px; cursor: default; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
    .tile.small:hover { transform: none; }
    .tile.last { outline: 2px solid var(--red); }
    .tile.back {
      background: linear-gradient(160deg, #2f6fb8 0%, #1d4f8f 60%, #173f75 100%);
      border-color: #12325c; color: transparent; cursor: default;
      font-size: 0;
    }
    .tile.back::after { content: "🀫"; font-size: 26px; opacity: .9; }
    .tile.back.small { min-width: 30px; height: 38px; border-radius: 5px; }
    .tile.back.small::after { font-size: 17px; }
    .melds .tile { cursor: default; }
    .melds .tile:hover { transform: none; }

    /* 抽牌指示 */
    .drawn-mark { color: var(--gold); font-size: 13px; font-weight: 700; margin-left: 8px; }

    /* —— 操作区 —— */
    .action-bar {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
      padding: 10px 0 4px;
    }
    .action-bar button {
      font-size: 17px; font-weight: 700; padding: 12px 30px; border-radius: 12px;
      border-width: 2px; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    }
    .action-bar button.hu { background: linear-gradient(#e0564a, #b02f24); border-color: #ff9d8f; color: #fff; }
    .action-bar button.primary { font-size: 18px; padding: 13px 38px; }
    .claim-banner {
      text-align: center; color: var(--gold); font-weight: 700; font-size: 15px;
      animation: turnGlow 1.2s ease-in-out infinite; border-radius: 10px;
      background: rgba(240,199,94,.12); border: 1px dashed rgba(240,199,94,.5);
      padding: 6px; margin-bottom: 8px;
    }

    /* —— 底部信息面板 —— */
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 800px) { .bottom-grid { grid-template-columns: 1fr; } .table-mid { grid-template-columns: 1fr; } }
    .lines { font-size: 13px; }
    .lines .l { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed #2f5f43; padding: 4px 2px; }
    .lines .l b { color: var(--gold); white-space: nowrap; }
    .settle-head { color: var(--gold); font-weight: 700; margin-bottom: 4px; }
    .log {
      max-height: 170px; overflow-y: auto; font-size: 12.5px; color: #9fd0b2;
      font-family: "Cascadia Mono", Consolas, monospace; line-height: 1.7;
      background: rgba(0,0,0,.25); border-radius: 8px; padding: 8px 10px;
    }
    .log::-webkit-scrollbar { width: 8px; }
    .log::-webkit-scrollbar-thumb { background: #2f6b45; border-radius: 4px; }
    :root { --gold:#e9cc91; --panel:rgba(16,35,31,.94); --line:#36534a; }
    body { background:#0c1916; color:#f2eee3; }
    #app { max-width:1280px; padding:20px 28px 36px; }
    header.top { padding-bottom:22px; } .logo { text-shadow:none; } .logo small { color:#a7b9ae; }
    .hero { position:relative; overflow:hidden; border:1px solid #526050; border-radius:22px; min-height:350px; margin-bottom:24px; background:linear-gradient(90deg,rgba(7,24,19,.94),rgba(7,24,19,.3)),url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1800&q=85') center/cover; }
    .hero-copy { padding:42px; max-width:620px; } .eyebrow { font-size:11px; letter-spacing:3px; color:var(--gold); } h1 { font-family:Georgia,'Microsoft YaHei',serif; font-size:48px; line-height:1.3; margin:18px 0; letter-spacing:4px; } .hero p { color:#c1cfc5; line-height:1.8; } .hero a { display:inline-block; color:var(--gold); margin-top:24px; text-decoration:none; } .photo-credit { position:absolute; bottom:16px; right:20px; font-size:10px; color:#ccd7ce; }
    #lobby { padding:24px; } #lobby h2 { margin-bottom:18px; font-size:20px; } h2 small { font-size:12px; color:#9fb1a6; font-weight:400; margin-left:12px; } #lobby .ctl { gap:12px; } button,input,select { min-height:42px; } button { background:#244d3e; } button.primary { background:#e3c485; color:#24362c; }
    .table { border:8px solid #6b5237; background:radial-gradient(ellipse at center,#34745a,#153e30); padding:24px; } .table::before { display:none; } .seat { background:rgba(8,29,23,.6); min-width:0; } .table-mid { grid-template-columns:minmax(0,1fr) 180px minmax(0,1fr); margin:18px 0; } .table-center { min-width:0; } .tile { min-width:48px; height:66px; font-size:46px; } .tile.small { min-width:30px; height:40px; font-size:29px; } [data-testid="hand"] { display:flex; flex-wrap:wrap; gap:4px; padding-top:14px; }
    dialog { margin:auto; width:min(520px,92vw); max-height:90vh; overflow:auto; padding:28px; color:#eee9dc; background:#142d24; border:1px solid #647558; border-radius:18px; box-shadow:0 30px 100px #0009; } dialog::backdrop { background:#0009; backdrop-filter:blur(5px); } .settings-head { display:flex; align-items:center; justify-content:space-between; } dialog p { font-size:13px; color:#acbfb1; margin:16px 0; line-height:1.7; } dialog label { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px 0; } #rule-settings>* { display:block; width:100%!important; margin:12px 0; } body.reduce-motion *,body.reduce-motion *::after { animation:none!important; transition:none!important; } :focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    @media(max-width:800px) { #app { padding:12px; } .hero-copy { padding:28px; } h1 { font-size:36px; } .table-mid { grid-template-columns:1fr; } .table-center { order:-1; } .seat-side { margin:8px 0; } .seat { width:100%; } .table { padding:12px; } .logo small { display:block; margin:4px 0; } }
    @media(prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important; } }
    body.in-game .hero, body.in-game #lobby { display:none; }
    body.in-game #app { max-width:none; min-height:100vh; }
    body.in-game .table { min-height:65vh; display:flex; flex-direction:column; justify-content:space-between; }
    body.in-game .bottom-grid { margin-top:20px; }
    body.in-game header.top { padding-bottom:12px; }
  </style>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="logo">雀界 · 广东麻将<small>岭南牌局 · 闲坐一局</small></div>
      <div class="spacer"></div>
      <button id="btn-settings" aria-haspopup="dialog">⚙ 设置</button><button id="btn-home" class="hidden">← 返回大厅</button><span id="conn-status" data-testid="conn-status"></span>
    </header>

    <section class="hero"><div class="hero-copy"><span class="eyebrow">QUEJIE / CANTONESE MAHJONG</span><h1>一桌好牌，<br>一刻闲趣。</h1><p>地道广东规则，邀好友入座，或与 AI 切磋牌技。</p><a href="#lobby">开启你的下一局 ↓</a></div><div class="photo-credit">实景摄影 · Unsplash</div></section>
    <div id="lobby" class="panel"><h2>入座开局 <small>选择玩法，即刻开始</small></h2>
      <div class="ctl">
        <input id="name-input" data-testid="name-input" placeholder="昵称" value="玩家" style="width:90px" />
        <select id="preset-select" data-testid="preset-select">
          <option value="gd128">gd128 红中变主流</option>
          <option value="gd136">gd136 全牌</option>
          <option value="gd100">gd100 条筒字</option>
          <option value="gd108">gd108 无字</option>
        </select>
        <select id="cap-select" data-testid="cap-select">
          <option value="fixed3">封顶 3 番</option>
          <option value="fixed5">封顶 5 番</option>
          <option value="tiered">分档封顶 3/4/5</option>
          <option value="formula">动态封顶（杠数）</option>
          <option value="unlimited">不封顶（hardCap 10）</option>
        </select>
        <button id="btn-local" data-testid="btn-local" class="primary">本地单机（PVE）</button>
        <button id="btn-create" data-testid="btn-create">创建联机房间</button>
        <input id="join-code" data-testid="join-code" placeholder="房间号" style="width:90px" />
        <button id="btn-join" data-testid="btn-join">加入房间</button>
        <label class="switch"><input type="checkbox" id="auto-play" data-testid="auto-play" /> 自动托管本机</label>
      </div>
    </div>

    <div id="room-panel" class="panel hidden">
      <h2>房间 <span id="room-code" data-testid="room-code" style="color:var(--gold)"></span>
        <span id="rules-summary" style="font-size:12px;color:#9fd0b2;font-weight:400"></span>
      </h2>
      <div id="players" class="row" data-testid="players"></div>
      <div class="row">
        <button id="btn-ready" data-testid="btn-ready">准备</button>
        <button id="btn-start-ai" data-testid="btn-start-ai" class="primary">填充 AI 并开始</button>
        <button id="btn-leave" data-testid="btn-leave" class="danger">离开房间</button>
      </div>
    </div>

    <div id="table-panel" class="hidden">
      <div class="table-topbar">
        <span class="badge" id="wall-count" data-testid="wall-count"></span>
        <span class="badge" id="dealer-info"></span>
        <span class="badge scores" id="scores" data-testid="scores"></span>
      </div>

      <div class="table">
        <div id="claim-hint" data-testid="claim-hint"></div>
        <div class="seat-zone"><div id="seat-2" class="seat" data-testid="seat-2"></div></div>
        <div class="table-mid">
          <div class="seat-side left"><div id="seat-3" class="seat" data-testid="seat-3"></div></div>
          <div class="table-center">
            <div class="center-info" id="center-info"></div>
          </div>
          <div class="seat-side right"><div id="seat-1" class="seat" data-testid="seat-1"></div></div>
        </div>
        <div class="seat-zone bottom">
          <div id="seat-0" class="seat bottom-seat" data-testid="seat-0"></div>
        </div>
      </div>

      <div class="action-bar" id="action-bar" data-testid="action-bar"></div>

      <div class="bottom-grid">
        <div class="panel" style="margin-bottom:0">
          <h2>结算明细</h2>
          <div id="settle" class="lines" data-testid="settle-panel"></div>
        </div>
        <div class="panel" style="margin-bottom:0">
          <h2>对局日志</h2>
          <div id="log" class="log" data-testid="action-log"></div>
        </div>
      </div>
    </div>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><form method="dialog"><div class="settings-head"><h2 id="settings-title">牌局设置</h2><button aria-label="关闭设置">✕</button></div><p>规则和昵称用于下一局；显示与操作设置立即生效。</p><div id="rule-settings"></div><label>AI 出牌间隔<select id="ai-delay"><option value="150">快速 · 150 ms</option><option value="600">舒适 · 600 ms</option><option value="1200">悠闲 · 1.2 秒</option></select></label><label><input id="single-click" type="checkbox"> 单击直接出牌</label><label><input id="reduce-motion" type="checkbox"> 减少动态效果</label><button class="primary">完成并返回</button><span id="settings-status" role="status"></span></form></dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
